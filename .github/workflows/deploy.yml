name: Deploy to Render

on:
  push:
    branches: [claude/app-building-rswkr0, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered successfully!"
