name: Deploy to Render

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set - skipping (Render auto-deploys on push when the repo is connected in its dashboard)."
            exit 0
          fi
          curl -sf "$RENDER_DEPLOY_HOOK"
          echo "Deploy triggered successfully!"
